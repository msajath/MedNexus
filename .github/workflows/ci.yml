name: MedNexus CI and images
on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  MONGOMS_DISABLE_POSTINSTALL: '1'
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history for exposed secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --log-opts="--all" --redact --no-banner
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate || true
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.component }}
          path: ${{ matrix.component }}/coverage
          retention-days: 7
      - if: matrix.component == 'frontend'
        run: npm run lint
      - if: matrix.component == 'frontend'
        run: npm run build
      - if: matrix.component == 'frontend'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/mednexus_ci
      JWT_SECRET: integration-only-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx jest --runInBand --coverage --testPathPattern=integration
        working-directory: backend

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      QA_MONGO_URI: mongodb://127.0.0.1:27017/mednexus_browser_qa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-qa-report
          path: |
            frontend/playwright-report
            frontend/playwright-report-ui
            frontend/test-results
          retention-days: 7
  containers:
    needs: [checks, backend-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_USERNAME: ci
      MONGO_PASSWORD: ci-only-database-password
      MONGO_APP_USERNAME: ci_app
      MONGO_APP_PASSWORD: ci-only-app-password
      JWT_SECRET: ci-only-jwt-secret-not-for-deployment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config --quiet
      - name: Validate Atlas Compose configuration
        env:
          ATLAS_MONGO_URI: mongodb+srv://ci_app:ci-only-password@example.mongodb.net/medibook
          ALLOWED_ORIGINS: https://example.test
        run: docker compose -f docker-compose.atlas.yml config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify SPA and proxied API
        run: |
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/api/ready
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/login | grep -q '<div id="root"'
          curl --fail --head http://localhost:8080/login | grep -iq 'Content-Security-Policy'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/assets/does-not-exist.js)" = 404
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
  publish:
    needs: [secrets, checks, backend-integration, browser-qa, containers]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Normalize registry name
        id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ steps.registry.outputs.repository }}-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
