name: MedNexus CI and images
on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - if: matrix.component == 'frontend'
        run: npm run lint
      - if: matrix.component == 'frontend'
        run: npm run build
      - if: matrix.component == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/mednexus_ci
      JWT_SECRET: integration-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend

  containers:
    needs: [checks, backend-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_USERNAME: ci
      MONGO_PASSWORD: ci-only-database-password
      MONGO_APP_USERNAME: ci_app
      MONGO_APP_PASSWORD: ci-only-app-password
      JWT_SECRET: ci-only-jwt-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - name: Validate Atlas Compose configuration
        env:
          ATLAS_MONGO_URI: mongodb+srv://ci_app:ci-only-password@example.mongodb.net/medibook
          ALLOWED_ORIGINS: https://example.test
        run: docker compose -f docker-compose.atlas.yml config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify SPA and proxied API
        run: |
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/api/ready
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/login | grep -q '<div id="root"'
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
  publish:
    needs: [checks, backend-integration, containers]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Normalize registry name
        id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.registry.outputs.repository }}-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
