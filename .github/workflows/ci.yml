name: MedNexus CI and images
on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  MONGOMS_DISABLE_POSTINSTALL: '1'
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan complete Git history for exposed secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --log-opts="--all" --redact --no-banner
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.component }}
          path: ${{ matrix.component }}/coverage
          retention-days: 7
      - if: matrix.component == 'frontend'
        run: npm run lint
      - if: matrix.component == 'frontend'
        run: npm run build
      - if: matrix.component == 'frontend'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json
      - id: install
        run: npm ci
      - name: Audit all dependencies
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > audit-all.json
          status=$?
          cat audit-all.json
          exit "$status"
      - name: Audit production dependencies
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit-production.json
          status=$?
          cat audit-production.json
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-${{ matrix.component }}
          path: |
            ${{ matrix.component }}/audit-all.json
            ${{ matrix.component }}/audit-production.json
          if-no-files-found: warn
          retention-days: 14
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/mednexus_ci
      JWT_SECRET: integration-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Run integration tests against disposable MongoDB
        run: npx jest --runInBand --testPathPatterns=tests/integration --json --outputFile=integration-results.json
        working-directory: backend
      - name: Reject skipped integration suites
        run: |
          node -e "const r=require('./integration-results.json'); const suites=r.numPendingTestSuites||0; const tests=r.numPendingTests||0; if (suites || tests) { console.error('Integration tests were skipped: '+suites+' suites, '+tests+' tests'); process.exit(1); }"
        working-directory: backend
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-integration-results
          path: backend/integration-results.json
          if-no-files-found: warn
          retention-days: 14

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"quit(db.adminCommand('ping').ok ? 0 : 1)\""
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      QA_MONGO_URI: mongodb://127.0.0.1:27017/mednexus_browser_qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:ui
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-qa-report
          path: |
            frontend/playwright-report
            frontend/playwright-report-ui
            frontend/test-results
            frontend/test-results-ui
          retention-days: 7
  containers:
    needs: [checks, backend-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_USERNAME: ci
      MONGO_PASSWORD: ci-only-database-password
      MONGO_APP_USERNAME: ci_app
      MONGO_APP_PASSWORD: ci-only-app-password
      JWT_SECRET: ci-only-jwt-secret-not-for-deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate development isolation and production Compose configuration
        run: node scripts/checkComposeConfig.js
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify SPA and proxied API
        run: |
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8080/api/ready
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/login | grep -q '<div id="root"'
          curl --fail --head http://localhost:8080/login | grep -iq 'Content-Security-Policy'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/assets/does-not-exist.js)" = 404
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
  publish:
    needs: [secrets, checks, dependency-audit, backend-integration, browser-qa, containers]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Normalize registry name
        id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ steps.registry.outputs.repository }}-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
