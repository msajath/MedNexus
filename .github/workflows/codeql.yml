name: CodeQL security analysis
on:
  push:
    branches: [main, master, dev]
  pull_request:
  schedule:
    - cron: '18 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    # Public repositories can use CodeQL; private repositories require Code Security.
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
