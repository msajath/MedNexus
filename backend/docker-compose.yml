version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: medibook-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: medibook

volumes:
  mongo-data:
    name: medibook_mongo_data
