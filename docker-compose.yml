# Isolated local development only. Production/Atlas uses docker-compose.atlas.yml.
name: mednexus-dev
services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?Set MONGO_USERNAME in the root .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in the root .env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in the root .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in the root .env}
    volumes:
      - mongo_dev_data:/data/db
      - ./infra/mongo/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [database]
  backend:
    image: ${BACKEND_IMAGE:-mednexus-backend:local}
    build: ./backend
    init: true
    restart: unless-stopped
    environment:
      PORT: "5000"
      NODE_ENV: development
      DEV_COMPOSE_MONGO: "1"
      CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:-Asia/Colombo}
      TRUST_PROXY: "1"
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/mednexus_development?authSource=mednexus_development
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      mongodb:
        condition: service_healthy
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    networks: [database, web]
  frontend:
    image: ${FRONTEND_IMAGE:-mednexus-frontend:local}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks: [web]
volumes:
  mongo_dev_data:
networks:
  database:
    internal: true
  web:
