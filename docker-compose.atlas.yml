name: mednexus
services:
  backend:
    image: ${BACKEND_IMAGE:-mednexus-backend:local}
    build: ./backend
    init: true
    restart: unless-stopped
    environment:
      PORT: "5000"
      NODE_ENV: production
      CLINIC_TIME_ZONE: ${CLINIC_TIME_ZONE:-Asia/Colombo}
      TRUST_PROXY: "1"
      MONGO_URI: ${ATLAS_MONGO_URI:?Set ATLAS_MONGO_URI in .env.atlas}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.atlas}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the HTTPS origin in .env.atlas}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  frontend:
    image: ${FRONTEND_IMAGE:-mednexus-frontend:local}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    logging: *logging
